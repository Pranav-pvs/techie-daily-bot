name: Daily Edition

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if today's edition already exists"
        type: boolean
        default: false
        schedule:
          - cron: "30 1 * * *"  # 07:00 IST

permissions:
  contents: write

concurrency:
  group: techie-daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check whether today's edition already exists
        id: guard
        env:
          FORCE: ${{ inputs.force || 'false' }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          if [ "$FORCE" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Forced run: same-day check skipped."
          else
            DONE=$(TODAY="$TODAY" node -e 'const fs=require("fs");let runs=[];try{runs=JSON.parse(fs.readFileSync("data/state/run-log.json","utf8"))}catch(e){};const today=process.env.TODAY;console.log(runs.some(r=>r.command==="generate"&&r.status==="success"&&String(r.at).startsWith(today))?"true":"false")')
            echo "skip=$DONE" >> "$GITHUB_OUTPUT"
            echo "Edition already generated today: $DONE"
          fi

      - name: Collect articles
        if: steps.guard.outputs.skip == 'false'
        run: npm run collect

      - name: Generate edition
        if: steps.guard.outputs.skip == 'false'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: npm run generate

      - name: Upload edition for manual forwarding
        if: steps.guard.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: techie-daily-${{ github.run_id }}
          path: data/output/edition-*.png
          if-no-files-found: error
          retention-days: 30

      - name: Save state back to the repository
        if: always()
        run: |
          git config user.name "techie-daily-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/state
          if git diff --cached --quiet; then
            echo "No state changes to save."
          else
            git commit -m "Daily run $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi